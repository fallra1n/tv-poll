services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tvpoll
      POSTGRES_PASSWORD: tvpoll
      POSTGRES_DB: tvpoll
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tvpoll -d tvpoll"]
      interval: 2s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: ./backend
    entrypoint: ["/usr/local/bin/migrate", "up"]
    environment:
      DATABASE_URL: postgres://tvpoll:tvpoll@postgres:5432/tvpoll?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ./backend
    ports:
      - "8080:8080"
      - "9090:9090"
    environment:
      HTTP_ADDR: ":8080"
      METRICS_ADDR: "0.0.0.0:9090"
      DATABASE_URL: postgres://tvpoll:tvpoll@postgres:5432/tvpoll?sslmode=disable
      REDIS_ADDR: "redis:6379"
      ADMIN_TOKEN: ${ADMIN_TOKEN:-local-dev-admin-token}
      VOTE_TOKEN_SECRET: ${VOTE_TOKEN_SECRET:-local-dev-vote-token-secret-change-me}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  pg-data:
